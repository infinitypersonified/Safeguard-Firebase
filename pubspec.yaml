name: safeguard
description: Emergency Response Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Location Services
  geolocator: ^14.0.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # UI
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: any
  uuid: ^4.2.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  flutter_local_notifications: ^18.0.0
  url_launcher: ^6.2.2

  cupertino_icons: ^1.0.6
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
